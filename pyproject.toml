[project]
name = "diary"
version = "0.1.0"
description = "Dziennik emocji zamieniany w opowiadanie w stylu klasycznego autora."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
diary = "diary.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
